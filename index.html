<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Paisa Collection Manager Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .amount-btn { transition: all 0.2s; }
        .amount-btn:active { transform: scale(0.9); }
        
        /* Modal Animation */
        .modal-overlay { transition: opacity 0.3s ease; }
        .modal-content { transition: transform 0.3s ease; transform: scale(0.95); }
        .modal-open .modal-content { transform: scale(1); }

        @media print {
            nav, .filter-section, .no-print, .action-btn-container { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; padding: 0; }
            .max-w-6xl { max-width: 100%; }
        }
        
        #pending-list-modal::-webkit-scrollbar { width: 4px; }
        #pending-list-modal::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Navigation -->
    <nav class="bg-blue-800 text-white p-4 shadow-lg sticky top-0 z-50 no-print">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                💰 Collection Pro
            </h1>
            <div class="flex gap-4 text-sm">
                <button onclick="switchTab('dashboard')" class="hover:underline font-medium">Dashboard</button>
                <button onclick="switchTab('entry')" class="hover:underline font-medium">Entry</button>
                <button onclick="switchTab('clients')" class="hover:underline font-medium">Clients</button>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-4">
        
        <!-- DASHBOARD TAB -->
        <div id="tab-dashboard" class="tab-content">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 no-print">
                <div class="glass-card p-6 rounded-2xl shadow-sm border-l-4 border-blue-500">
                    <p class="text-gray-500 text-sm">Kul Jama (Total)</p>
                    <h2 class="text-3xl font-bold text-blue-600" id="stat-total">₹0</h2>
                </div>
                <div class="glass-card p-6 rounded-2xl shadow-sm border-l-4 border-green-500">
                    <p class="text-gray-500 text-sm">Is Mahine (This Month)</p>
                    <h2 class="text-3xl font-bold text-green-600" id="stat-month">₹0</h2>
                </div>
                <div class="glass-card p-6 rounded-2xl shadow-sm border-l-4 border-purple-500">
                    <p class="text-gray-500 text-sm">Kul Clients</p>
                    <h2 class="text-3xl font-bold text-purple-600" id="stat-clients">0</h2>
                </div>
            </div>

            <!-- Reports Section -->
            <div class="bg-white p-6 rounded-2xl shadow-sm overflow-hidden">
                <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 no-print">
                    <h3 class="font-bold text-xl text-gray-800">Collection Reports</h3>
                    <div class="flex gap-2">
                        <button onclick="window.print()" class="bg-gray-100 p-2 rounded-lg hover:bg-gray-200">🖨️ Print</button>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6 no-print filter-section">
                    <input type="text" id="filter-name" oninput="updateDashboard()" placeholder="Search Name/ID..." class="p-2 border rounded-lg text-sm outline-none focus:ring-1 focus:ring-blue-500">
                    <select id="filter-address" onchange="updateDashboard()" class="p-2 border rounded-lg text-sm outline-none">
                        <option value="ALL">All Address</option>
                    </select>
                    <select id="filter-month" onchange="updateDashboard()" class="p-2 border rounded-lg text-sm outline-none">
                        <option value="ALL">All Months</option>
                        <option value="01">January</option>
                        <option value="02">February</option>
                        <option value="03">March</option>
                        <option value="04">April</option>
                        <option value="05">May</option>
                        <option value="06">June</option>
                        <option value="07">July</option>
                        <option value="08">August</option>
                        <option value="09">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                    <input type="date" id="filter-date" onchange="updateDashboard()" class="p-2 border rounded-lg text-sm outline-none">
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse" id="report-table">
                        <thead>
                            <tr class="bg-gray-50 text-gray-400 text-sm uppercase tracking-wider">
                                <th class="p-3">Date</th>
                                <th class="p-3">Name & ID</th>
                                <th class="p-3">Address</th>
                                <th class="p-3">Amount</th>
                                <th class="p-3 text-right no-print">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="recent-list"></tbody>
                        <tfoot>
                            <tr class="bg-blue-50 font-bold border-t-2 border-blue-200">
                                <td colspan="3" class="p-3 text-right">Report Total:</td>
                                <td class="p-3 text-blue-700" id="recent-total">₹0</td>
                                <td class="no-print"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>

        <!-- ENTRY TAB -->
        <div id="tab-entry" class="tab-content hidden">
            <!-- Action Button for Baki Entry Pop-up -->
            <div class="flex justify-center mb-6 mt-4 action-btn-container">
                <button onclick="openPendingModal()" class="bg-orange-500 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:bg-orange-600 transition-all flex items-center gap-2">
                    ⏳ Baki Entry Check Karein
                </button>
            </div>

            <div class="max-w-2xl mx-auto">
                <div class="bg-white p-8 rounded-3xl shadow-xl border-t-4 border-blue-600">
                    <h2 id="entry-form-title" class="text-2xl font-bold mb-6 text-center text-blue-600 underline decoration-blue-200">New Payment Entry</h2>
                    <form id="entryForm" class="space-y-4">
                        <input type="hidden" id="edit-record-id">
                        <div class="relative">
                            <label class="block text-sm font-medium text-gray-600">Search Client Name/ID</label>
                            <input type="text" id="entry-search" oninput="searchClient(this.value)" onfocus="showDefaultClients()" autocomplete="off" placeholder="Type name or ID..." class="w-full p-3 bg-gray-50 border rounded-xl mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
                            <div id="search-results" class="absolute w-full bg-white border mt-1 rounded-xl shadow-2xl z-20 max-h-48 overflow-y-auto hidden"></div>
                            <input type="hidden" id="entry-client-id" required>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-600">Selected ID</label>
                                <input type="text" id="entry-id-display" class="w-full p-3 bg-gray-200 border rounded-xl mt-1 font-bold text-blue-700 text-center" readonly placeholder="---">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-600">Entry Date</label>
                                <input type="date" id="entry-date" class="w-full p-3 bg-gray-50 border rounded-xl mt-1" required>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-600">Address</label>
                            <input type="text" id="entry-address" class="w-full p-3 bg-gray-200 border rounded-xl mt-1" readonly>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-2">Paisa Amount (₹)</label>
                            <div class="grid grid-cols-4 gap-2 mb-3">
                                <button type="button" onclick="quickAmount(100)" class="amount-btn bg-blue-50 text-blue-700 py-2 rounded-lg border border-blue-200 font-bold text-sm">100</button>
                                <button type="button" onclick="quickAmount(200)" class="amount-btn bg-blue-50 text-blue-700 py-2 rounded-lg border border-blue-200 font-bold text-sm">200</button>
                                <button type="button" onclick="quickAmount(300)" class="amount-btn bg-blue-50 text-blue-700 py-2 rounded-lg border border-blue-200 font-bold text-sm">300</button>
                                <button type="button" onclick="quickAmount(500)" class="amount-btn bg-blue-50 text-blue-700 py-2 rounded-lg border border-blue-200 font-bold text-sm">500</button>
                            </div>
                            <input type="number" id="entry-amount" class="w-full p-4 bg-yellow-50 border-2 border-yellow-200 rounded-xl focus:ring-2 focus:ring-yellow-500 outline-none font-bold text-2xl text-center" placeholder="0" required>
                        </div>
                        
                        <div class="flex gap-2">
                            <button type="submit" id="entry-submit-btn" class="flex-1 bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition shadow-lg text-lg">💾 ENTRY SAVE KAREIN</button>
                            <button type="button" id="entry-cancel-btn" onclick="resetEntryForm()" class="hidden bg-gray-200 text-gray-600 font-bold px-6 rounded-xl">CANCEL</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- CLIENTS TAB -->
        <div id="tab-clients" class="tab-content hidden">
            <div class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-xl mt-6">
                <h2 class="text-2xl font-bold mb-6 text-center text-green-600">Add New Customer</h2>
                <form id="clientForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Customer Name</label>
                        <input type="text" id="client-name" class="w-full p-3 bg-gray-50 border rounded-xl mt-1 focus:ring-2 focus:ring-green-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Mobile Number</label>
                        <input type="tel" id="client-mobile" class="w-full p-3 bg-gray-50 border rounded-xl mt-1 focus:ring-2 focus:ring-green-500 outline-none" placeholder="9800000000" pattern="[0-9]{10}">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Select Village/Area</label>
                        <select id="client-address" class="w-full p-3 bg-gray-50 border rounded-xl mt-1 focus:ring-2 focus:ring-green-500 outline-none" required></select>
                    </div>
                    <button type="submit" class="w-full bg-green-600 text-white font-bold py-4 rounded-xl hover:bg-green-700 transition shadow-lg">Save Client</button>
                </form>
            </div>

            <div class="mt-10 bg-white p-6 rounded-2xl shadow-sm">
                <div class="flex flex-col md:flex-row justify-between items-center mb-6">
                    <h3 class="font-bold text-xl text-gray-800">Customers List</h3>
                    <select id="client-list-filter" onchange="renderClients()" class="p-2 border rounded-lg text-sm"></select>
                </div>
                <div id="clients-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>
        </div>
    </div>

    <!-- MODAL: Baki Entry List -->
    <div id="pending-modal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-[100] p-4 modal-overlay">
        <div class="bg-white rounded-3xl max-w-lg w-full shadow-2xl overflow-hidden modal-content">
            <div class="bg-orange-500 p-4 flex justify-between items-center text-white">
                <h3 class="font-bold text-lg flex items-center gap-2">📋 Aaj Ki Baki List (<span id="pending-count">0</span>)</h3>
                <button onclick="closePendingModal()" class="text-2xl font-bold">&times;</button>
            </div>
            <div class="p-4">
                <div id="pending-list-modal" class="space-y-3 max-h-[60vh] overflow-y-auto">
                    <!-- Pending content -->
                </div>
                <button onclick="closePendingModal()" class="w-full mt-6 bg-gray-100 py-3 rounded-xl font-bold text-gray-600">Peeche Jayein</button>
            </div>
        </div>
    </div>

    <!-- General Alert Modal -->
    <div id="custom-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-[110] p-4">
        <div class="bg-white p-6 rounded-2xl max-w-xs w-full text-center shadow-2xl">
            <div id="modal-icon" class="text-4xl mb-2">✅</div>
            <p id="modal-msg" class="text-gray-700 font-medium"></p>
            <button onclick="closeModal()" class="mt-4 bg-blue-600 text-white px-6 py-2 rounded-lg w-full">Theek Hai</button>
        </div>
    </div>

    <script>
        let clients = JSON.parse(localStorage.getItem('col_v2_clients')) || [];
        let records = JSON.parse(localStorage.getItem('col_v2_records')) || [];

        const baseAddresses = ['DUMARI', 'SAKRAULI', 'MUSAPUR', 'MALPUR', 'ASMA', 'BAHUARA'];
        const addressPrefixes = { 'DUMARI': 'DM', 'SAKRAULI': 'SK', 'MUSAPUR': 'MS', 'MALPUR': 'ML', 'ASMA': 'AS', 'BAHUARA': 'BH' };

        window.onload = () => {
            const dateInput = document.getElementById('entry-date');
            if(dateInput) dateInput.valueAsDate = new Date();
            populateAddressDropdowns();
            updateDashboard();
            renderClients();
        };

        function populateAddressDropdowns() {
            const sels = ['client-address', 'filter-address', 'client-list-filter'];
            sels.forEach(id => {
                const el = document.getElementById(id);
                if(el) {
                    let html = id !== 'client-address' ? '<option value="ALL">All Address</option>' : '';
                    html += baseAddresses.map(a => `<option value="${a}">${a}</option>`).join('');
                    el.innerHTML = html;
                }
            });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            if(tabId === 'dashboard') updateDashboard();
        }

        // --- Baki Entry Pop-up Logic ---
        function openPendingModal() {
            const modal = document.getElementById('pending-modal');
            const listDiv = document.getElementById('pending-list-modal');
            const countBadge = document.getElementById('pending-count');
            const selectedDate = document.getElementById('entry-date').value;
            
            const entriesToday = records.filter(r => r.date === selectedDate).map(r => r.clientId);
            const pending = clients.filter(c => !entriesToday.includes(c.id));

            countBadge.textContent = pending.length;
            modal.classList.remove('hidden');
            document.body.classList.add('modal-open');

            if(pending.length === 0) {
                listDiv.innerHTML = '<div class="text-center py-10 text-gray-400 italic">Aaj sabka collection ho gaya! 🎉</div>';
                return;
            }

            listDiv.innerHTML = pending.map(c => `
                <div onclick="selectFromModal('${c.id}')" class="p-4 border rounded-2xl hover:bg-orange-50 cursor-pointer flex justify-between items-center transition-all bg-white shadow-sm border-gray-100">
                    <div>
                        <p class="font-bold text-gray-800">${c.name}</p>
                        <p class="text-[11px] text-gray-400">ID: ${c.id} | ${c.address}</p>
                    </div>
                    <div class="bg-orange-100 text-orange-600 px-3 py-1 rounded-full text-xs font-bold">ENTRY +</div>
                </div>
            `).join('');
        }

        function closePendingModal() {
            document.getElementById('pending-modal').classList.add('hidden');
            document.body.classList.remove('modal-open');
        }

        function selectFromModal(id) {
            selectClientForEntry(id);
            closePendingModal();
        }

        // --- Entry Logic ---
        function showDefaultClients() {
            if(document.getElementById('entry-search').value) return;
            const res = document.getElementById('search-results');
            res.innerHTML = clients.slice(0, 5).map(c => `
                <div onclick="selectClientForEntry('${c.id}')" class="p-3 border-b hover:bg-gray-50 cursor-pointer">
                    <p class="font-bold text-sm">${c.name}</p><p class="text-[10px] text-gray-400">${c.id} - ${c.address}</p>
                </div>`).join('');
            res.classList.remove('hidden');
        }

        function searchClient(q) {
            const res = document.getElementById('search-results');
            if(!q) { showDefaultClients(); return; }
            const matches = clients.filter(c => c.name.toLowerCase().includes(q.toLowerCase()) || c.id.toLowerCase().includes(q.toLowerCase()));
            res.innerHTML = matches.map(c => `
                <div onclick="selectClientForEntry('${c.id}')" class="p-3 border-b hover:bg-gray-50 cursor-pointer">
                    <p class="font-bold text-sm">${c.name}</p><p class="text-[10px] text-gray-400">${c.id} - ${c.address}</p>
                </div>`).join('');
            res.classList.remove('hidden');
        }

        function selectClientForEntry(id) {
            const c = clients.find(cl => cl.id === id);
            if(c) {
                document.getElementById('entry-search').value = c.name;
                document.getElementById('entry-client-id').value = c.id;
                document.getElementById('entry-id-display').value = c.id;
                document.getElementById('entry-address').value = c.address;
                document.getElementById('search-results').classList.add('hidden');
            }
        }

        function quickAmount(v) { document.getElementById('entry-amount').value = v; }

        document.getElementById('entryForm').onsubmit = (e) => {
            e.preventDefault();
            const cid = document.getElementById('entry-client-id').value;
            const editId = document.getElementById('edit-record-id').value;
            const client = clients.find(c => c.id === cid);
            
            if(!client) return showAlert('Pehle customer select karein!', '❌');
            
            const amt = parseFloat(document.getElementById('entry-amount').value);
            const date = document.getElementById('entry-date').value;

            if (editId) {
                const idx = records.findIndex(r => r.id == editId);
                if (idx !== -1) {
                    records[idx] = { ...records[idx], clientId: client.id, name: client.name, address: client.address, amount: amt, date: date };
                }
            } else {
                records.push({ id: Date.now(), clientId: client.id, name: client.name, address: client.address, amount: amt, date: date });
            }
            
            localStorage.setItem('col_v2_records', JSON.stringify(records));
            resetEntryForm();
            showAlert('Entry Safalta-purvak Save Hui!', '💰');
            updateDashboard();
        };

        function resetEntryForm() {
            const form = document.getElementById('entryForm');
            form.reset();
            document.getElementById('entry-date').valueAsDate = new Date();
            document.getElementById('edit-record-id').value = "";
            document.getElementById('entry-id-display').value = "";
            document.getElementById('entry-form-title').innerText = "New Payment Entry";
            document.getElementById('entry-submit-btn').innerText = "💾 ENTRY SAVE KAREIN";
            document.getElementById('entry-cancel-btn').classList.add('hidden');
        }

        function editEntry(id) {
            const rec = records.find(r => r.id == id);
            if(!rec) return;
            
            switchTab('entry');
            document.getElementById('edit-record-id').value = rec.id;
            document.getElementById('entry-client-id').value = rec.clientId;
            document.getElementById('entry-search').value = rec.name;
            document.getElementById('entry-id-display').value = rec.clientId;
            document.getElementById('entry-address').value = rec.address;
            document.getElementById('entry-amount').value = rec.amount;
            document.getElementById('entry-date').value = rec.date;
            
            document.getElementById('entry-form-title').innerText = "Edit Payment Entry";
            document.getElementById('entry-submit-btn').innerText = "Sudharein (Update)";
            document.getElementById('entry-cancel-btn').classList.remove('hidden');
        }

        function deleteEntry(id) {
            if(!confirm("Kya aap is entry ko delete karna chahte hain?")) return;
            records = records.filter(r => r.id !== id);
            localStorage.setItem('col_v2_records', JSON.stringify(records));
            updateDashboard();
        }

        // --- Dashboard & Reports ---
        function updateDashboard() {
            const fName = document.getElementById('filter-name').value.toLowerCase();
            const fAddr = document.getElementById('filter-address').value;
            const fDate = document.getElementById('filter-date').value;
            const fMonth = document.getElementById('filter-month').value;

            const filtered = records.filter(r => {
                const recordDate = new Date(r.date);
                const recordMonth = (recordDate.getMonth() + 1).toString().padStart(2, '0');
                
                const matchesName = (r.name.toLowerCase().includes(fName) || r.clientId.toLowerCase().includes(fName));
                const matchesAddress = (fAddr === 'ALL' || r.address === fAddr);
                const matchesDate = (!fDate || r.date === fDate);
                const matchesMonth = (fMonth === 'ALL' || recordMonth === fMonth);

                return matchesName && matchesAddress && matchesDate && matchesMonth;
            });

            // Stats update
            document.getElementById('stat-total').textContent = `₹${records.reduce((s, r) => s + r.amount, 0)}`;
            const now = new Date();
            const curMonth = (now.getMonth() + 1).toString().padStart(2, '0');
            const curYear = now.getFullYear();
            const mTotal = records.filter(r => r.date.startsWith(`${curYear}-${curMonth}`)).reduce((s, r) => s + r.amount, 0);
            
            document.getElementById('stat-month').textContent = `₹${mTotal}`;
            document.getElementById('stat-clients').textContent = clients.length;
            
            // List update
            const list = document.getElementById('recent-list');
            list.innerHTML = '';
            let total = 0;
            
            // Sort by date then id descending
            filtered.sort((a,b) => {
                if (b.date !== a.date) return b.date.localeCompare(a.date);
                return b.id - a.id;
            }).forEach(r => {
                total += r.amount;
                list.innerHTML += `
                    <tr class="border-t hover:bg-gray-50 text-sm">
                        <td class="p-3 text-gray-600">${r.date}</td>
                        <td class="p-3"><b>${r.name}</b><br><small class="text-gray-400">${r.clientId}</small></td>
                        <td class="p-3 text-gray-600">${r.address}</td>
                        <td class="p-3 text-blue-700 font-bold">₹${r.amount}</td>
                        <td class="p-3 text-right no-print">
                            <div class="flex justify-end gap-3">
                                <button onclick="editEntry(${r.id})" title="Edit" class="bg-blue-50 text-blue-600 p-1.5 rounded-lg hover:bg-blue-100 transition">✏️</button>
                                <button onclick="deleteEntry(${r.id})" title="Delete" class="bg-red-50 text-red-500 p-1.5 rounded-lg hover:bg-red-100 transition">🗑️</button>
                            </div>
                        </td>
                    </tr>`;
            });
            document.getElementById('recent-total').textContent = `₹${total}`;
        }

        // --- Client Management ---
        document.getElementById('clientForm').onsubmit = (e) => {
            e.preventDefault();
            const name = document.getElementById('client-name').value;
            const addr = document.getElementById('client-address').value;
            const mob = document.getElementById('client-mobile').value || "N/A";
            
            const prefix = addressPrefixes[addr];
            const count = clients.filter(c => c.address === addr).length;
            const id = prefix + (count + 1).toString().padStart(2, '0');

            clients.push({ id, name, address: addr, mobile: mob });
            localStorage.setItem('col_v2_clients', JSON.stringify(clients));
            e.target.reset();
            renderClients();
            showAlert('Customer List mein jud gaya!', '👤');
        };

        function renderClients() {
            const list = document.getElementById('clients-list');
            const filter = document.getElementById('client-list-filter').value;
            const filtered = filter === 'ALL' ? clients : clients.filter(c => c.address === filter);
            list.innerHTML = filtered.map(c => `
                <div class="p-4 border rounded-xl bg-white shadow-sm flex justify-between items-center">
                    <div>
                        <p class="font-bold text-blue-900">${c.name}</p>
                        <p class="text-xs text-gray-500">ID: ${c.id} | ${c.mobile}</p>
                    </div>
                    <span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold">${c.address}</span>
                </div>
            `).join('');
        }

        function showAlert(m, i) {
            document.getElementById('modal-msg').textContent = m;
            document.getElementById('modal-icon').textContent = i;
            document.getElementById('custom-modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('custom-modal').classList.add('hidden'); }

        document.addEventListener('click', (e) => {
            const results = document.getElementById('search-results');
            const searchInput = document.getElementById('entry-search');
            if(results && searchInput && !searchInput.contains(e.target)) 
                results.classList.add('hidden');
        });
    </script>
</body>
</html>
